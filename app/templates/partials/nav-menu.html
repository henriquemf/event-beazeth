{# Menu da barra lateral. A lista vem de `app/navigation.py`, compartilhada com
   a barra inferior do celular. `active_page` vem de cada blueprint. #}
<nav class="menu">
    {% for link in nav_links %}
    <a class="menu-link {% if active_page == link.key %}active{% endif %}" href="{{ url_for(link.endpoint) }}"
       {% if active_page == link.key %}aria-current="page"{% endif %}>
        <span aria-hidden="true">{{ link.icon }}</span>
        <span>{{ link.label }}</span>
    </a>
    {% endfor %}
</nav>
